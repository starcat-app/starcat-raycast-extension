name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.2
          cache: npm
      - name: Verify release tag
        run: |
          if [[ ! "${GITHUB_REF_NAME}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '${GITHUB_REF_NAME}' must use vMAJOR.MINOR.PATCH"
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          if ! grep -Fq "## [${version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no ${version} release section"
            exit 1
          fi

          # 正式 Release 必须来自 main 历史，避免从临时分支意外发布。
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::Tag '${GITHUB_REF_NAME}' is not reachable from main"
            exit 1
          fi
      - name: Verify and build
        run: |
          npm ci
          npm test
          npm run typecheck
          npm run lint
          npm run build
          bash -n scripts/*.sh
      - name: Build release assets
        run: |
          scripts/package-release.sh "${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          unzip -t "release/starcat-raycast-extension-${GITHUB_REF_NAME#v}.zip"
          tar -tzf "release/starcat-raycast-extension-${GITHUB_REF_NAME#v}.tar.gz" >/dev/null
          (
            cd release
            shasum -a 256 -c checksums.txt
          )
      - name: Prepare release notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v prefix="## [${version}]" '
            index($0, prefix) == 1 { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md >release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "::error::Release notes for ${version} are empty"
            exit 1
          fi
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            release/*.zip
            release/*.tar.gz
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=()
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            release/starcat-raycast-extension-*.zip \
            release/starcat-raycast-extension-*.tar.gz \
            release/checksums.txt \
            "${release_args[@]}" \
            --verify-tag \
            --title "Starcat Raycast Extension ${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
